*{box-sizing:border-box;margin:0}
/* ==================== 5 DISTINCTIVE THEMES ==================== */
/* 1. Light Theme (Clean DCEAY Original) */
:root, :root[data-theme="light"] {
  --bg: #f4f5fa;
  --sf: #ffffff;
  --sf2: #edf0f8;
  --tx: #0f1422;
  --mu: #555b6e;
  --border: rgba(0, 0, 0, 0.08);
  --card-border: 1px solid rgba(0, 0, 0, 0.08);
  --ac: #6366f1;
  --mini: #1b1f29;
  --minitx: #ffffff;
  --minibtn: #ffffff;
  --minibtntx: #111111;
  color-scheme: light;
  box-sizing: border-box;
}

:root[data-theme="dark"] {
  --bg: #0c0e17;
  --sf: #131622;
  --sf2: #1b1f30;
  --tx: #f3f4f8;
  --mu: #8c93a8;
  --border: rgba(255, 255, 255, 0.08);
  --card-border: 1px solid rgba(255, 255, 255, 0.08);
  --ac: #7c5dfa;
  --mini: #1b1f30;
  --minitx: #ffffff;
  --minibtn: #7c5dfa;
  --minibtntx: #ffffff;
  color-scheme: dark;
}

:root[data-theme="cyberpunk"] {
  --bg: #070410;
  --sf: #0f0a20;
  --sf2: #181133;
  --tx: #00ffff;
  --mu: #ff77ff;
  --border: rgba(255, 0, 255, 0.28);
  --card-border: 1px solid rgba(255, 0, 255, 0.38);
  --ac: #00ffff;
  --mini: #0f0a20;
  --minitx: #00ffff;
  --minibtn: #ff00ff;
  --minibtntx: #070410;
  color-scheme: dark;
}

:root[data-theme="glassmorphism"] {
  --bg: #090a12;
  --sf: rgba(20, 21, 32, 0.88);
  --sf2: rgba(30, 32, 48, 0.88);
  --tx: #f3f4f6;
  --mu: #9ea3b5;
  --border: rgba(255, 255, 255, 0.12);
  --card-border: 1px solid rgba(255, 255, 255, 0.14);
  --ac: #6366f1;
  --mini: rgba(20, 21, 32, 0.9);
  --minitx: #ffffff;
  --minibtn: #6366f1;
  --minibtntx: #ffffff;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  color-scheme: dark;
}

:root[data-theme="midnight"] {
  --bg: #000000;
  --sf: #07080a;
  --sf2: #121318;
  --tx: #ffffff;
  --mu: #8a8e9b;
  --border: rgba(255, 255, 255, 0.08);
  --card-border: 1px solid rgba(255, 255, 255, 0.1);
  --ac: #3b82f6;
  --mini: #121318;
  --minitx: #ffffff;
  --minibtn: #3b82f6;
  --minibtntx: #ffffff;
  color-scheme: dark;
}

/* 3. Cyberpunk Theme (Neon Pink & Cyan with double borders) */
:root[data-theme="cyberpunk"]{--bg:#0a0714;--sf:#130e24;--sf2:#1d1536;--tx:#00ffff;--mu:#ff00ff;--ac:#00ffff;--mini:#130e24;--minitx:#00ffff;--minibtn:#ff00ff;--minibtntx:#0a0714;--card-border:2px double #ff00ff;color-scheme:dark}

/* 4. Glassmorphism Theme (Frosted semi-transparent & faint white borders) */
:root[data-theme="glassmorphism"]{--bg:#0e1017;--sf:#14141e99;--sf2:#1d1e2e99;--tx:#e6e6e6;--mu:#9ca3af;--ac:#6366f1;--mini:#14141e99;--minitx:#fff;--minibtn:#6366f1;--minibtntx:#fff;--card-border:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color-scheme:dark}

/* 5. Midnight OLED Theme (Pure Inky Black) */
:root[data-theme="midnight"]{--bg:#000000;--sf:#0c0d10;--sf2:#15161c;--tx:#f9fafb;--mu:#6b7280;--ac:#3b82f6;--mini:#15161c;--minitx:#fff;--minibtn:#3b82f6;--minibtntx:#fff;--card-border:1px solid rgba(255,255,255,0.08);color-scheme:dark}

.two{display:flex;gap:12px}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:0 20px}
.hc{flex:0 0 140px;cursor:pointer}.hc .art{width:140px;height:140px;border-radius:22px;margin-bottom:8px;overflow:hidden;background-size:cover!important;background-position:center!important}
.hc b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hc span{color:var(--mu);font-size:13px}
.art{background:radial-gradient(circle at 30% 25%,var(--b),transparent 62%),linear-gradient(145deg,var(--a),#0b1020);background-size:cover!important;background-position:center!important;background-repeat:no-repeat}

.sg{display:flex;background:var(--sf2);border-radius:999px;padding:5px;margin:8px 0;border:var(--card-border);gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none !important;-ms-overflow-style:none !important;box-sizing:border-box}

.sg button{flex:1;min-height:38px;border:0;background:none;border-radius:999px;padding:8px 16px;color:var(--mu);font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s,box-shadow .2s}

.th-card{position:relative;background:var(--sf);border:var(--card-border);border-radius:18px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;user-select:none}

.badge-soon{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 9px;border-radius:999px;background:rgba(236,72,153,0.18);color:#f472b6;border:1px solid rgba(244,114,182,0.4);vertical-align:middle;margin-left:8px;text-transform:uppercase}

#nav{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:8px;gap:12px;display:flex;align-items:center;z-index:3;box-shadow:0 14px 34px rgba(10,16,40,.2);border:var(--card-border)}

#mini{position:absolute;left:12px;right:12px;bottom:96px;background:var(--mini);color:var(--minitx);border-radius:26px;padding:8px 10px;display:flex;align-items:center;gap:10px;overflow:hidden;cursor:pointer;z-index:2;box-shadow:0 12px 32px rgba(10,16,40,.28);border:var(--card-border);transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .35s}
#mini div{flex:1;min-width:0}

#mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);width:0}
.pp{width:42px;height:42px;border-radius:50%;border:0;background:var(--minibtn);color:var(--minibtntx);display:grid;place-items:center;flex:none}

@media (min-width: 768px){
  #mini{left:50%;right:auto;transform:translateX(-50%);bottom:92px;width:min(680px,calc(100% - 48px));padding:10px 14px;border-radius:30px;box-shadow:0 16px 44px rgba(10,16,40,.25)}
}
.npo #mini,.npo #nav{display:none!important;opacity:0!important;pointer-events:none!important}

/* Enhanced Dynamic Artwork Background for Lyrics & Now Playing */



/* 100% Edge-to-Edge True Full-Screen Now Playing & Lyrics (Zero Bottom Gap) */
#np {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: 100% !important;
  height: 100% !important;
  min-width: 100% !important;
  min-height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  background: #08090e !important;
  color: #ffffff !important;
  transform: translateY(100%);
  transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.25, 1);
  display: flex !important;
  flex-direction: column !important;
  padding: 24px 20px 24px !important;
  box-sizing: border-box !important;
  z-index: 999999 !important;
  isolation: isolate;
  overflow: hidden !important;
  margin: 0 !important;
}
#np.open {
  transform: translateY(0) !important;
}

/* Ensure no background elements bleed through when Now Playing is open */
.npo #mini, .npo #nav, .npo #pcbg, .npo #view {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* Multi-layer Dynamic Glowing Artwork Background (Fully Covers Beyond Borders) */
.npbg {
  position: absolute;
  top: -20%;
  left: -20%;
  right: -20%;
  bottom: -20%;
  width: 140%;
  height: 140%;
  z-index: -2;
  filter: blur(60px) saturate(2.0);
  opacity: 0.85;
  background-size: cover;
  background-position: center;
  pointer-events: none;
  transform: translate3d(0, 0, 0);
  -webkit-transform: translate3d(0, 0, 0);
  will-change: opacity;
  transition: opacity 0.35s ease;
}
.npbg-mesh {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  background: 
    radial-gradient(circle at 25% 20%, color-mix(in srgb, var(--ac) 45%, transparent), transparent 65%),
    radial-gradient(circle at 80% 65%, color-mix(in srgb, #ec4899 40%, transparent), transparent 70%),
    radial-gradient(circle at 45% 95%, color-mix(in srgb, var(--ac) 35%, transparent), transparent 60%),
    linear-gradient(to bottom, rgba(8, 9, 14, 0.2) 0%, rgba(8, 9, 14, 0.35) 60%, rgba(8, 9, 14, 0.5) 100%);
  pointer-events: none;
}
@keyframes ambientFloat {
  0% { transform: scale(1.1) translate(0, 0); }
  50% { transform: scale(1.25) translate(-2%, 2%); }
  100% { transform: scale(1.1) translate(2%, -2%); }
}

/* Cyberpunk 16-Bar Audio Visualizer */
.re-vis{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:22px;margin:2px 0 6px;opacity:.8}
.re-vis i{flex:1;max-width:5px;height:20%;background:linear-gradient(to top,var(--ac),#ec4899);border-radius:3px;transform-origin:bottom;transition:height .15s ease}
.re-vis.playing i:nth-child(1){animation:visJump .7s ease-in-out infinite alternate}
.re-vis.playing i:nth-child(2){animation:visJump .9s ease-in-out .1s infinite alternate}
.re-vis.playing i:nth-child(3){animation:visJump .6s ease-in-out .2s infinite alternate}
.re-vis.playing i:nth-child(4){animation:visJump 1.1s ease-in-out .05s infinite alternate}
.re-vis.playing i:nth-child(5){animation:visJump .8s ease-in-out .15s infinite alternate}
.re-vis.playing i:nth-child(6){animation:visJump .5s ease-in-out .25s infinite alternate}
.re-vis.playing i:nth-child(7){animation:visJump 1s ease-in-out .1s infinite alternate}
.re-vis.playing i:nth-child(8){animation:visJump .75s ease-in-out .3s infinite alternate}
.re-vis.playing i:nth-child(9){animation:visJump .95s ease-in-out .05s infinite alternate}
.re-vis.playing i:nth-child(10){animation:visJump .65s ease-in-out .2s infinite alternate}
.re-vis.playing i:nth-child(11){animation:visJump 1.05s ease-in-out .15s infinite alternate}
.re-vis.playing i:nth-child(12){animation:visJump .85s ease-in-out .25s infinite alternate}
.re-vis.playing i:nth-child(13){animation:visJump .7s ease-in-out .1s infinite alternate}
.re-vis.playing i:nth-child(14){animation:visJump 1s ease-in-out .3s infinite alternate}
.re-vis.playing i:nth-child(15){animation:visJump .8s ease-in-out .05s infinite alternate}
.re-vis.playing i:nth-child(16){animation:visJump .6s ease-in-out .2s infinite alternate}
@keyframes visJump{0%{height:15%}50%{height:85%}100%{height:30%}}



/* Play Queue Styles */
#qu{flex:1;overflow-y:auto;display:none;padding:14px 0 35vh;scrollbar-width:none!important;-ms-overflow-style:none!important}
#qu::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.q-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,0.04);margin-bottom:8px;border:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:background .2s,border-color .2s}

/* ========================================================
   CYBERPUNK GLITCH LOADER: D GLITCHES FOR 0.5s DEAD IN THE CENTER,
   THEN 1-LETTER 'D' TRANSITIONS TO REVEAL 4 LETTERS (C,E,A,Y)
   ======================================================== */
#intro{position:fixed;inset:0;background:#000000;z-index:99999;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .8s cubic-bezier(.2,.8,.2,1)}
#intro.done{opacity:0;pointer-events:none}
#splash{position:absolute;inset:0;background:#000000;display:flex;align-items:center;justify-content:center}
.dceay-loader{position:relative;display:flex;align-items:center;justify-content:center;user-select:none}
.dceay-wordmark{display:flex;align-items:center;justify-content:center;gap:14px;height:84px;position:relative}

.glyph-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.glyph{height:68px;width:auto;display:block;fill:#ffffff;filter:drop-shadow(0 0 16px rgba(255,255,255,0.3))}

/* --- LETTER 1: D --- */
/* 100% DEAD CENTER DURING GLITCH (0s - 0.5s) */
.glyph-d {
  position: relative;
  z-index: 5;
  animation: dGlitchOnly 0.5s steps(2, start) forwards;
}

/* Glitch Ghost Duplicates */
.d-ghost {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  opacity: 0;
}
.d-ghost-cyan {
  fill: #00ffff !important;
  animation: glitchCyan 0.5s steps(2, start) forwards;
}
.d-ghost-magenta {
  fill: #ff007f !important;
  animation: glitchMagenta 0.5s steps(2, start) forwards;
}

.d-scanline {
  position: absolute;
  left: -20px;
  right: -20px;
  height: 3px;
  background: #00ffff;
  box-shadow: 0 0 8px #00ffff;
  pointer-events: none;
  opacity: 0;
  animation: scanlineFlash 0.5s linear forwards;
}

/* --- THE 4 LETTERS: C, E, A, Y --- */
/* Starts at max-width: 0 during 0.5s glitch, then smoothly unfolds to the right */
.remaining-letters {
  display: flex;
  align-items: center;
  gap: 14px;
  max-width: 0;
  opacity: 0;
  overflow: hidden;
  animation: revealRemainingLetters 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
}

.glyph-c { animation: letterPopIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.52s both; }
.glyph-e { animation: letterPopIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.64s both; }
.glyph-a { animation: letterPopIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.76s both; }
.glyph-y { animation: letterPopIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.88s both; }

/* Subtitle and Laser positioned absolutely so D is in dead-center of screen */
.laser-line {
  position: absolute;
  top: calc(100% + 18px);
  left: 50%;
  transform: translateX(-50%);
  height: 2px;
  background: linear-gradient(90deg, transparent, #ffffff, var(--ac), #ffffff, transparent);
  box-shadow: 0 0 12px rgba(255,255,255,0.5);
  animation: laserPulse 1.4s cubic-bezier(0.2, 0.9, 0.2, 1) 0.9s forwards;
  width: 0;
  opacity: 0;
}

.tagline {
  position: absolute;
  top: calc(100% + 28px);
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.55em;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  animation: taglineIn 0.8s ease 1.05s forwards;
}

/* ================= KEYFRAMES ================= */

/* D Glitch: Zero offset, stays 100% in exact middle and center */
@keyframes dGlitchOnly {
  0% {
    opacity: 0;
    transform: scale(0.92);
  }
  10% {
    opacity: 1;
    transform: scale(1.05) translate(-2px, 1px) skewX(4deg);
    filter: drop-shadow(0 0 24px #00ffff);
  }
  25% {
    transform: scale(0.96) translate(3px, -2px) skewX(-5deg);
    filter: drop-shadow(0 0 20px #ff007f);
  }
  45% {
    transform: scale(1.03) translate(-1px, 2px) skewX(3deg);
    filter: drop-shadow(0 0 22px #00ffff);
  }
  65% {
    transform: scale(0.98) translate(2px, -1px) skewX(-2deg);
  }
  85% {
    transform: scale(1.01) translate(0, 0) skewX(1deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) translate(0, 0) skewX(0);
    filter: drop-shadow(0 0 16px rgba(255,255,255,0.4));
  }
}

/* Cyan Glitch Channel */
@keyframes glitchCyan {
  0% { opacity: 0; transform: translate(0, 0); }
  10% { opacity: 0.9; transform: translate(-8px, -2px) skewX(-8deg); clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%); }
  30% { opacity: 0.85; transform: translate(-5px, 2px) skewX(4deg); clip-path: polygon(0 50%, 100% 50%, 100% 80%, 0 80%); }
  55% { opacity: 0.95; transform: translate(-9px, -1px) skewX(-10deg); clip-path: polygon(0 20%, 100% 20%, 100% 60%, 0 60%); }
  80% { opacity: 0.5; transform: translate(-3px, 1px); clip-path: polygon(0 70%, 100% 70%, 100% 100%, 0 100%); }
  100% { opacity: 0; transform: translate(0, 0); }
}

/* Magenta Glitch Channel */
@keyframes glitchMagenta {
  0% { opacity: 0; transform: translate(0, 0); }
  15% { opacity: 0.9; transform: translate(8px, 2px) skewX(10deg); clip-path: polygon(0 40%, 100% 40%, 100% 75%, 0 75%); }
  35% { opacity: 0.85; transform: translate(6px, -3px) skewX(-5deg); clip-path: polygon(0 10%, 100% 10%, 100% 45%, 0 45%); }
  60% { opacity: 0.9; transform: translate(8px, 1px) skewX(8deg); clip-path: polygon(0 65%, 100% 65%, 100% 95%, 0 95%); }
  85% { opacity: 0.4; transform: translate(2px, -1px); clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%); }
  100% { opacity: 0; transform: translate(0, 0); }
}

/* Scanline Flashes */
@keyframes scanlineFlash {
  0% { opacity: 0; top: 15%; }
  25% { opacity: 0.95; top: 35%; height: 5px; }
  50% { opacity: 0.8; top: 60%; height: 3px; background: #ff007f; box-shadow: 0 0 8px #ff007f; }
  75% { opacity: 0.95; top: 75%; height: 4px; background: #00ffff; }
  100% { opacity: 0; top: 90%; }
}

/* 4 Letters Container expands starting at 0.5s */
@keyframes revealRemainingLetters {
  0% {
    max-width: 0;
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    max-width: 440px;
    opacity: 1;
  }
}

/* Each of the 4 letters pops in with micro-glitch clarity */
@keyframes letterPopIn {
  0% {
    opacity: 0;
    transform: translateY(12px) scale(0.85) skewX(-6deg);
    filter: blur(5px) drop-shadow(0 0 16px var(--ac));
  }
  60% {
    opacity: 1;
    transform: translateY(-2px) scale(1.04) skewX(2deg);
    filter: blur(0);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1) skewX(0);
    filter: blur(0);
  }
}

@keyframes laserPulse {
  0% { width: 0; opacity: 0; }
  50% { width: 220px; opacity: 1; }
  100% { width: 150px; opacity: 0.6; }
}

@keyframes taglineIn {
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

async function loadTrend(){
  try{
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    const r = await fetch("https://itunes.apple.com/us/rss/topsongs/limit=20/json", { signal: controller.signal });
    clearTimeout(timeoutId);
    if(r.ok){
      const j = await r.json();
      const entries = (j.feed && j.feed.entry) || [];
      const fresh = entries.map(e => {
        const id = e.id && e.id.attributes ? "itunes-" + e.id.attributes["im:id"] : "itunes-" + Math.random();
        const title = e["im:name"] ? e["im:name"].label : "Untitled";
        const artist = e["im:artist"] ? e["im:artist"].label : "Unknown Artist";
        const link = (e.link || []).find(l => l.attributes && l.attributes.type === "audio/x-m4a") || (e.link && e.link[1]);
        const src = link && link.attributes ? link.attributes.href : "";
        const rawArt = e["im:image"] && e["im:image"][2] ? e["im:image"][2].label : "";
        const art = rawArt.replace("170x170bb", "600x600bb");
        return { id, title, artist, dur: 30, art, src };
      }).filter(t => t.src);
      if(fresh.length){
        L.trend = fresh;
        tState = "ok";
        if(tab === "home") render();
        return;
      }
    }
  }catch(err){
    try{
      const controller2 = new AbortController();
      const timeoutId2 = setTimeout(() => controller2.abort(), 5000);
      const r2 = await fetch("https://itunes.apple.com/search?term=pop+hits&entity=song&limit=15", { signal: controller2.signal });
      clearTimeout(timeoutId2);
      if(r2.ok){
        const j2 = await r2.json();
        const fresh2 = (j2.results || []).filter(r => r.previewUrl).map(normItunes);
        if(fresh2.length){
          L.trend = fresh2;
          tState = "ok";
          if(tab === "home") render();
          return;
        }
      }
    }catch(e2){}
  }
  if(!L.trend || !L.trend.length){
    L.trend = [...TRENDING_GLOBAL];
  }
  tState = "ok";
  if(tab === "home") render();
}

function onSearch(v){
  q=v;clearTimeout(onSearch.h);
  if(!v.trim()){sState="idle";L.search=[];res();return}
  sState="loading";res();
  onSearch.h=setTimeout(()=>{
    const val=q.toLowerCase().trim();
    const allLocal=[...GLOBAL_HITS,...KHMER_LIST];
    const localMatches=allLocal.filter(k=>k.title.toLowerCase().includes(val)||k.artist.toLowerCase().includes(val));
    fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=25`)
      .then(r=>r.json())
      .then(j=>{
        if(val!==q.toLowerCase().trim())return;
        const itunesMatches=(j.results||[])
          .filter(r=>r.previewUrl)
          .map(normItunes)
          .filter(it=>!localMatches.some(loc=>loc.title.toLowerCase()===it.title.toLowerCase()&&loc.artist.toLowerCase()===it.artist.toLowerCase()));
        L.search=[...localMatches,...itunesMatches];
        sState="ok";res();
      })
      .catch(()=>{
        L.search=localMatches;
        sState=localMatches.length?"ok":"err";
        res();
      });
  },280);
}

function lyr(t){
  const key=t.id||t.title;
  if(LYC[key])return;
  if(KHMER_LRC[t.id]){
    LYC[key]={s:"sync",lines:parseLRC(KHMER_LRC[t.id]),plain:[]};
    if(cur()&&cur().id===t.id)drawLy();
    return;
  }
  const d=LYC[key]={s:"loading",lines:[],plain:[]},e=encodeURIComponent,u="https://lrclib.net/api/";
  fetch(`${u}get?track_name=${e(t.title)}&artist_name=${e(t.artist)}&duration=${Math.round(t.dur||240)}`).then(r=>r.ok?r.json():Promise.reject()).catch(()=>fetch(`${u}search?q=${e(t.artist+" "+t.title)}`).then(r=>r.json()).then(a=>a.find(x=>x.syncedLyrics)||a[0])).then(x=>{
    if(x&&x.syncedLyrics){d.lines=parseLRC(x.syncedLyrics);d.s=d.lines.length?"sync":"none"}
    else if(x&&x.plainLyrics){d.plain=x.plainLyrics.split("\n");d.s="plain"}
    else d.s="none";
  }).catch(()=>{d.s="none"}).then(()=>{if(cur()&&cur().id===t.id)drawLy()});
}

function drawLy(){

  paint();
}

function importLocalAudio(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const name = file.name.replace(/\.[^/.]+$/, "");
  const track = {
    id: "imported-" + Date.now(),
    title: name,
    artist: "Imported Track",
    dur: 0,
    art: "",
    src: url
  };
  L.hist = [track, ...L.hist.filter(x => x.id !== track.id)].slice(0, 12);
  Q = [track, ...Q];
  i = 0;
  load();
  toast("Now playing: " + name);
}

function load(){
  const t=cur();if(!t)return;

  // Strict mismatch prevention guard
  if(t.src === "cinderella.webm" && !t.title.toLowerCase().includes("cinderella")){
    toast("Audio mismatch blocked: Cannot play '" + t.title + "' as Cinderella!");
    return;
  }
  if(t.src === "heaven_sent.webm" && !t.title.toLowerCase().includes("heaven sent")){
    toast("Audio mismatch blocked: Cannot play '" + t.title + "' as Heaven Sent!");
    return;
  }
  if(t.src === "new_jeans.webm" && !t.title.toLowerCase().includes("new jeans")){
    toast("Audio mismatch blocked: Cannot play '" + t.title + "' as New Jeans!");
    return;
  }

  L.hist=[t,...L.hist.filter(x=>x.id!==t.id)].slice(0,12);
  save();

  // Instant Native HTML5 Audio: Starts immediately with zero lag
  if(t.src){
    if(au.src !== t.src) au.src = t.src;
    au.play().catch(e => console.warn("Playback error:", e));
  }
  setTrack();
  paint();
}

function play(n,k){Q=L[n].slice();i=k;load()}
function toggle(){
  const t=cur();if(!t)return;
  if(au.paused){
    if(!au.src&&t.src)au.src=t.src;
    au.play().catch(()=>{});
  }else{
    au.pause();
  }
  const btns=[$("#mp"),$("#np2")];
  btns.forEach(e=>anim(e,[{transform:"scale(.8)"},{transform:"scale(1)"}],320));
  paint();
}
function seekTo(val){
  const t=cur();if(!t)return;
  au.currentTime=val;
  paint();
}
function next(auto){
  if(!Q.length)return;
  if(rep&&auto){
    seekTo(0);
    au.play().catch(()=>{});
  }else{
    i=shuf&&Q.length>1?(i+1+Math.floor(Math.random()*(Q.length-1)))%Q.length:(i+1)%Q.length;
    load();
  }
}
function prev(){
  if(!Q.length)return;
  if(getPos()>3)seekTo(0);
  else{i=(i-1+Q.length)%Q.length;load()}
}
function toggleLike(t){
  if(!t)return;
  const k=L.fav.findIndex(x=>x.id===t.id);
  k>=0?L.fav.splice(k,1):L.fav.unshift(t);
  save();paint();
  if(isCur(t))[$("#mh"),$("#nh")].forEach(e=>anim(e,[{transform:"scale(1)"},{transform:"scale(1.5)"},{transform:"scale(1)"}],400));
  refresh();
}

function drawQueue(){

        <button class="pill" style="padding:6px 12px;font-size:11.5px;background:rgba(239,68,68,0.2);color:#fca5a5;display:inline-flex;align-items:center;gap:5px" onclick="clearQueue()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Clear</button>
      </div>
    </div>
    <div id="q-items">
      ${Q.map((trk, k) => `
        <div class="q-item ${k===i?'cur':''}" onclick="playFromQueue(${k})">
          <div style="width:24px;text-align:center;font-size:12px;color:rgba(255,255,255,0.6);flex-shrink:0">
            ${k===i ? EQ() : (k + 1)}
          </div>
          ${art(trk, "s")}
          <div style="flex:1;min-width:0">
            <b>${k===i ? '<span style="color:var(--ac);font-size:10px;margin-right:6px">● NOW PLAYING</span>' : ''}${esc(trk.title)}</b>
            <span>${esc(trk.artist)}</span>
          </div>
          <span style="font-size:11.5px;color:rgba(255,255,255,0.5);margin-right:4px">${trk.dur ? fmt(trk.dur) : ''}</span>
          ${Q.length > 1 ? `<button class="q-del" title="Remove" onclick="event.stopPropagation();removeFromQueue(${k})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg></button>` : ''}
        </div>
      `).join("")}
    </div>
  `;
}

function playFromQueue(k){
  i = k;
  load();
  drawQueue();
}

function removeFromQueue(k){
  if(Q.length <= 1){
    toast("Cannot remove the only song in queue");
    return;
  }
  const removed = Q.splice(k, 1)[0];
  if(k < i) i--;
  else if(k === i){
    i = i % Q.length;
    load();
  }
  drawQueue();
  toast(`Removed "${removed.title}" from queue`);
}

function shuffleQueue(){
  if(Q.length <= 1) return;
  const current = Q[i];
  const others = Q.filter((_, k) => k !== i);
  for(let j = others.length - 1; j > 0; j--){
    const r = Math.floor(Math.random() * (j + 1));
    [others[j], others[r]] = [others[r], others[j]];
  }
  Q = [current, ...others];
  i = 0;
  drawQueue();
  toast("Queue shuffled");
}

function clearQueue(){
  if(!Q.length) return;
  const current = cur();
  Q = [current];
  i = 0;
  drawQueue();
  toast("Queue cleared (Playing current song)");
}

function addToQueue(track){
  if(!track) return;
  Q.push(track);
  if(pane === "queue") drawQueue();
  toast(`Added to Queue: "${track.title}"`);
}

function shareTrack(t){
  t = t || cur();
  if(!t) return;
  const title = t.title || "Track";
  const artist = t.artist || "Artist";
  const shareText = `Listening to "${title}" by ${artist} on DCEAY Music`;
  if(navigator.share){
    navigator.share({
      title: `${title} - ${artist}`,
      text: shareText,
      url: window.location.href
    }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(shareText).then(()=>{
      toast("Track info & link copied to clipboard");
    }).catch(()=>{
      toast(`Shared: "${title}" by ${artist}`);
    });
  }
}

// ==========================================
// SLEEP TIMER
// ==========================================
const SLEEP_OPTS = [0, 15, 30, 45, 60];
let sleepIdx = 0;
let sleepTimeout = null;

function setSleepBtnText(text){
  const txt = $("#bslp-txt");
  if(txt) txt.textContent = text;
  else if($("#bslp")) $("#bslp").innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span id="bslp-txt">${text}</span>`;
}

function cycleSleepTimer(){
  sleepIdx = (sleepIdx + 1) % SLEEP_OPTS.length;
  const mins = SLEEP_OPTS[sleepIdx];
  clearTimeout(sleepTimeout);
  if(mins === 0){
    setSleepBtnText("Off");
    toast("Sleep timer turned OFF");
  } else {
    setSleepBtnText(`${mins}m`);
    toast(`Sleep timer set for ${mins} minutes`);
    sleepTimeout = setTimeout(()=>{
      let v = au.volume;
      const fade = setInterval(()=>{
        v = Math.max(0, v - 0.1);
        au.volume = v;
        if(v <= 0.05){
          clearInterval(fade);
          au.pause();
          au.volume = 1;
          sleepIdx = 0;
          setSleepBtnText("Off");
          paint();
          toast("Sleep timer ended. Music paused.");
        }
      }, 200);
    }, mins * 60 * 1000);
  }
}

// BEEMUSIC DESKTOP ENGINE: PLAYLIST TABLE, DYNAMIC LYRICS
// ========================================================

let pcLyricsOpen = false;

function toggleDynamicLyrics(force) {
  pcLyricsOpen = (force !== undefined) ? force : !pcLyricsOpen;
  const panel = document.getElementById("pc-dynamic-lyrics-panel");
  if (panel) {
    panel.classList.toggle("active", pcLyricsOpen);
    if (pcLyricsOpen) renderDynamicKaraokeLyrics();
  }
}



function renderDynamicKaraokeLyrics() {
  const mount = document.getElementById("pc-karaoke-lyrics-mount");
  if (!mount) return;
  const t = cur();
  if (!t) {
    mount.innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;padding:40px 0">Play a song to view dynamic lyrics</p>';
    return;
  }
  const key = t.id || t.title;
  const d = key && LYC[key];
  if (!d || d.s === "loading") {
    mount.innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;padding:40px 0">Looking for synchronized lyrics...</p>';
  } else if (d.s === "sync") {
    mount.innerHTML = d.lines.map((l, k) => `
      <div class="pc-karaoke-line" data-i="${k}" onclick="seekTo(${l.t})">${esc(l.text) || ""}</div>
    `).join('');
  } else if (d.s === "plain") {
    mount.innerHTML = d.plain.map(l => `<div class="pc-karaoke-line" style="filter:none;opacity:0.8">${esc(l)}</div>`).join('');
  } else {
    mount.innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;padding:40px 0">No synchronized lyrics available for this track.</p>';
  }
}

// Hook paint() to synchronize timeline, playing button, and Dynamic Lyrics
const _oldPaint = paint;
let _lastPaintedTrackId = null;
let _lastLikedState = null;
let _lastPlayState = null;
let _lastActiveKaraokeIdx = -2;

paint = function() {
  _oldPaint();
  const t = cur();
  const pl = isPlaying();
  const p = getPos();
  const d = getDur();

  // 1. Center Player Seeker & Time (High-frequency, lightweight)
  const seekSlider = document.getElementById("pc-timeline-slider");
  if (seekSlider) { seekSlider.max = d; seekSlider.value = p; }
  const curTime = document.getElementById("pc-cur-time");
  if (curTime) curTime.textContent = fmt(p);
  const durTime = document.getElementById("pc-dur-time");
  if (durTime) durTime.textContent = fmt(d);

  // 2. Play/Pause Button
  if (pl !== _lastPlayState) {
    _lastPlayState = pl;
    const centerPlayBtn = document.getElementById("pc-center-play-btn");
    if (centerPlayBtn) {
      centerPlayBtn.innerHTML = pl ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>' : '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
    }
  }

  // 3. Heart like button & Track metadata (Only update when state or track changes)
  if (t) {
    const lk = liked(t);
    if (lk !== _lastLikedState) {
      _lastLikedState = lk;
      const centerHeart = document.getElementById("pc-center-heart");
      if (centerHeart) {
        centerHeart.innerHTML = svgHeart(lk, 17);
        centerHeart.classList.toggle("liked", lk);
      }
    }

    if (t.id !== _lastPaintedTrackId) {
      _lastPaintedTrackId = t.id;
      const pcArtUrl = cleanArtUrl(t.art);
      const banner = document.getElementById("pc-trending-banner");
      if (banner && pcArtUrl) banner.style.backgroundImage = `url("${pcArtUrl}")`;
      const trendTitle = document.getElementById("pc-trending-title");
      if (trendTitle) trendTitle.textContent = t.title;
      const trendArtist = document.getElementById("pc-trending-artist");
      if (trendArtist) trendArtist.textContent = t.artist;

      const miniCover = document.getElementById("pc-mini-cover");
      if (miniCover && pcArtUrl) miniCover.style.backgroundImage = `url("${pcArtUrl}")`;
      const miniTitle = document.getElementById("pc-mini-title");
      if (miniTitle) miniTitle.textContent = t.title;
      const miniArtist = document.getElementById("pc-mini-artist");
      if (miniArtist) miniArtist.textContent = t.artist;

      const mesh = document.getElementById("pc-lyric-glow-mesh");
      if (mesh && pcArtUrl) mesh.style.backgroundImage = `url("${pcArtUrl}")`;
      const songName = document.getElementById("pc-lyric-song-title");
      if (songName) songName.textContent = `${t.title} • ${t.artist}`;

      document.querySelectorAll(".pc-row-track").forEach(row => {
        const titleEl = row.querySelector(".pc-row-title");
        if (titleEl) {
          row.classList.toggle("active", titleEl.textContent === t.title);
        }
      });
    }
  }

  // 4. Karaoke lyrics sync (Only update when active line index changes!)
  const key = t && (t.id || t.title), D = key && LYC[key];
  if (D && D.s === "sync" && pcLyricsOpen) {
    let activeIdx = -1;
    D.lines.forEach((l, k) => { if (l.t <= p) activeIdx = k; });
    if (activeIdx !== _lastActiveKaraokeIdx) {
      _lastActiveKaraokeIdx = activeIdx;
      document.querySelectorAll(".pc-karaoke-line").forEach(el => {
        const idx = +el.getAttribute("data-i");
        const isCur = (idx === activeIdx);
        el.classList.toggle("active", isCur);
        if (isCur) {
          el.scrollIntoView({ block: "center", behavior: "smooth" });
        }
      });
    }
  }
};

const _oldRender = render;
render = function(a) {
  _oldRender(a);
  

  // Update logo in sidebar
  const logoMount = document.getElementById("pc-brand-logo-mount");
  if (logoMount) {
    logoMount.innerHTML = getLogoSVG(prefs.logoStyle, 48);
  }

  // Sync active sidebar nav button
  let activeNav = "home";
  if (tab === "home") activeNav = "home";
  else if (tab === "search") activeNav = "search";
  else if (tab === "settings") activeNav = "settings";
  else if (tab === "library") {
    if (libTab === "khmer") activeNav = "lib-khmer";
    else if (libTab === "global") activeNav = "lib-global";
    else if (libTab === "fav") activeNav = "fav";
    else if (libTab === "hist") activeNav = "recent";
    else activeNav = "lib-khmer";
  }

  
};

function changeLogoStyle(style) {
  prefs.logoStyle = style;
  save();
  const favSvg = LOGOS[style] || LOGOS["cyberpunk-glass"];
  const blob = new Blob([favSvg], {type: "image/svg+xml"});
  const url = URL.createObjectURL(blob);
  let link = document.querySelector("link[rel*='icon']");
  if (!link) {
    link = document.createElement("link");
    link.rel = "shortcut icon";
    document.head.appendChild(link);
  }
  link.href = url;
  const logoMount = document.getElementById("pc-brand-logo-mount");
  if (logoMount) {
    logoMount.innerHTML = getLogoSVG(style, 48);
  }
  render();
}

function downloadSvgAsset(style, type) {
  const content = type === 'appicon' ? (APP_ICONS[style] || APP_ICONS["cyberpunk-glass"]) : (LOGOS[style] || LOGOS["cyberpunk-glass"]);
  const filename = `DCEAY-${style}-${type}.svg`;
  const blob = new Blob([content], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

</script>
